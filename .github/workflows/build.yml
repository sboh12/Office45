name: Build Flutter AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=$GITHUB_WORKSPACE/android/upload-keystore.jks" >> android/key.properties

      - name: DEBUG - Verify signing config
        run: |
          echo "=== android/key.properties ==="
          cat android/key.properties
          echo ""
          echo "=== Keystore file size ==="
          ls -la android/upload-keystore.jks
          echo ""
          echo "=== First 100 bytes of the keystore (hex) ==="
          head -c 100 android/upload-keystore.jks | xxd | head -5
          echo ""
          echo "=== Keytool verification ==="
          keytool -list -keystore android/upload-keystore.jks -storepass "${{ secrets.ANDROID_STORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" 2>&1 || echo "KEYTOOL FAILED - PASSWORD OR FILE IS WRONG"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Flutter version
        run: flutter --version

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
